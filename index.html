<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>作业记录本</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="作业记录本" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#f5f5f7" />
<link rel="icon" href="icon-180.png" />
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --text-2: #6b6b73;
    --text-3: #9a9aa2;
    --line: #ececef;
    --line-2: #e2e2e6;
    --accent: #6b4fd8;
    --accent-2: #8a72e6;
    --accent-soft: #f0ecfd;
    --red: #e5484d;
    --red-soft: #fdecec;
    --orange: #d97b06;
    --orange-soft: #fdf3e3;
    --green: #2f9e5f;
    --green-soft: #e8f6ee;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(16,16,24,.04), 0 6px 18px rgba(16,16,24,.05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: 20px 16px calc(96px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .hidden { display: none !important; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }

  /* ============ 通用控件 ============ */
  .btn {
    border: none; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600;
    padding: 11px 18px; background: var(--accent); color: #fff; transition: transform .12s, opacity .15s;
  }
  .btn:hover { opacity: .9; }
  .btn:active { transform: scale(.975); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.plain { background: #f0f0f2; color: var(--text); }
  .btn.block { width: 100%; padding: 13px; font-size: 15px; border-radius: 13px; }
  .btn.sm { padding: 9px 13px; font-size: 13px; border-radius: 10px; }
  .link { background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; padding: 4px 0; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 7px; font-weight: 600; }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 13px;
    font-size: 16px; background: #fafafa; color: var(--text); transition: border-color .15s, background .15s;
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(107,79,216,.09);
  }
  .msg { font-size: 13px; border-radius: 11px; padding: 10px 13px; margin-bottom: 14px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: var(--red-soft); color: var(--red); }
  .msg.ok { background: var(--green-soft); color: var(--green); }

  /* ============ 登录页 ============ */
  #authView { padding-top: 4vh; }
  .brand { text-align: center; margin-bottom: 22px; }
  .brand-mark {
    width: 62px; height: 62px; border-radius: 17px; margin: 0 auto 14px;
    background: linear-gradient(150deg, #7d63e0, #5b3fc9);
    color: #fff; font-size: 27px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(107,79,216,.25);
  }
  .brand h1 { font-size: 21px; font-weight: 700; }
  .brand p { color: var(--text-2); font-size: 13.5px; margin-top: 6px; }
  .auth-card {
    max-width: 400px; margin: 0 auto; background: var(--card);
    border-radius: var(--radius); padding: 22px 20px; box-shadow: var(--shadow);
  }
  .tabs { display: flex; background: #f2f2f4; border-radius: 12px; padding: 3px; margin-bottom: 20px; }
  .tabs button {
    flex: 1; border: none; background: transparent; padding: 9px 0; border-radius: 9px;
    font-size: 13.5px; font-weight: 600; color: var(--text-2); cursor: pointer; transition: all .15s;
  }
  .tabs button.active { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.09); }
  .otp-row { display: flex; gap: 8px; align-items: flex-start; }
  .otp-row .field { flex: 1; }
  .otp-row .btn { margin-top: 27px; white-space: nowrap; }
  .auth-foot { text-align: center; margin-top: 14px; color: var(--text-3); font-size: 12.5px; }

  /* ============ 主界面 ============ */
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .greet { font-size: 22px; font-weight: 700; }
  .greet-sub { font-size: 13px; color: var(--text-3); margin-top: 3px; }
  .topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
  .user-bar { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-3); max-width: 190px; }
  .user-bar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat {
    background: var(--card); border-radius: 14px; padding: 13px 14px; box-shadow: var(--shadow);
  }
  .stat b { display: block; font-size: 21px; font-weight: 700; }
  .stat span { font-size: 12px; color: var(--text-3); }
  .stat.warn b { color: var(--orange); }
  .stat.good b { color: var(--green); }

  .deadline-reminder {
    margin: -4px 0 16px; padding: 12px 14px; border-left: 4px solid var(--orange);
    border-radius: 10px; background: var(--orange-soft); color: var(--text);
  }
  .deadline-reminder-title { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--orange); }
  .deadline-reminder-title span { font-size: 12px; font-weight: 500; color: var(--text-2); }
  .deadline-reminder-list { display: flex; flex-direction: column; }
  .deadline-reminder-item {
    display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 6px 0;
    border: 0; border-top: 1px solid rgba(217,123,6,.16); background: transparent;
    color: inherit; text-align: left; font-size: 13px; cursor: pointer;
  }
  .deadline-reminder-item:first-child { border-top: 0; }
  .deadline-reminder-item strong { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  .deadline-reminder-item span { flex-shrink: 0; color: var(--text-2); font-size: 12px; }
  .deadline-reminder-item:hover strong { color: var(--accent); }

  .views { display: flex; gap: 5px; background: #ececed; border-radius: 13px; padding: 4px; margin-bottom: 14px; }
  .views button {
    flex: 1; border: none; background: transparent; padding: 10px 0; border-radius: 10px;
    font-size: 14px; font-weight: 600; color: var(--text-2); cursor: pointer; transition: all .15s;
  }
  .views button.active { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.09); }

  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .search { flex: 1; min-width: 0; position: relative; }
  .search input {
    width: 100%; border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px 10px 34px;
    font-size: 16px; background: var(--card); color: var(--text);
  }
  .search input:focus { outline: none; border-color: var(--accent); }
  .search::before {
    content: ""; position: absolute; left: 12px; top: 50%; width: 12px; height: 12px;
    margin-top: -7px; border: 1.6px solid var(--text-3); border-radius: 50%;
  }
  .search::after {
    content: ""; position: absolute; left: 21px; top: 50%; width: 5px; height: 1.6px;
    margin-top: 3px; background: var(--text-3); transform: rotate(45deg);
  }

  .filters { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 7px 14px; font-size: 12.5px; cursor: pointer; color: var(--text-2); white-space: nowrap; transition: all .15s;
  }
  .chip.active { background: var(--text); color: #fff; border-color: var(--text); }

  .group { margin-bottom: 20px; }
  .group-head {
    display: flex; align-items: center; gap: 8px; margin: 0 0 9px 3px;
    font-size: 12.5px; font-weight: 700; color: var(--text-2);
  }
  .group-head .count {
    font-weight: 600; font-size: 11px; color: var(--text-3); background: #ececef;
    border-radius: 999px; padding: 1px 8px;
  }
  .group-head.late { color: var(--red); }
  .group-head.late .count { background: var(--red-soft); color: var(--red); }
  .group-head.soon { color: var(--orange); }
  .group-head.soon .count { background: var(--orange-soft); color: var(--orange); }

  .hw-list { display: flex; flex-direction: column; gap: 9px; }
  .hw {
    position: relative; display: flex; gap: 12px; align-items: flex-start;
    background: var(--card); border-radius: 14px; padding: 14px 15px 14px 18px;
    box-shadow: var(--shadow); overflow: hidden; transition: transform .12s;
  }
  .hw:active { transform: scale(.995); }
  .hw::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--bar, #dcdce0);
  }
  .hw-main { flex: 1; min-width: 0; }
  .hw-title { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .hw.done { box-shadow: none; background: #fbfbfc; }
  .hw.done .hw-title { color: var(--text-3); font-weight: 500; text-decoration: line-through; text-decoration-color: var(--text-3); }
  .hw-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 7px; font-size: 12px; color: var(--text-3); }
  .course-tag { font-weight: 600; color: var(--text-2); }
  .due { font-weight: 600; }
  .due.late { color: var(--red); }
  .due.soon { color: var(--orange); }
  .due.ok { color: var(--text-3); }
  .hw-note { margin-top: 8px; font-size: 13px; color: var(--text-2); overflow-wrap: anywhere; white-space: pre-wrap; padding-left: 9px; border-left: 2px solid var(--line-2); }
  .hw-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    border: none; background: #f4f4f6; border-radius: 9px; width: 32px; height: 32px;
    cursor: pointer; font-size: 13px; color: var(--text-2); transition: all .15s;
  }
  .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .icon-btn.done-btn { background: var(--green-soft); color: var(--green); }
  .icon-btn.del-btn:hover { background: var(--red-soft); color: var(--red); }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn:disabled { opacity: .4; cursor: wait; }
  .status-filter { min-width: 96px; max-width: 120px; height: 44px; padding: 0 8px; border: 1px solid var(--line); border-radius: 11px; color: var(--text-2); background: var(--card); font-size: 14px; }
  .sync-bar { display: flex; gap: 8px; align-items: center; justify-content: flex-end; min-height: 42px; margin: 0 0 8px; font-size: 12px; color: var(--text-2); }
  .sync-bar .error { color: var(--red); }
  .sync-bar .icon-btn { background: transparent; }
  button { touch-action: manipulation; }
  button:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }
  .row .field, .otp-row .field { min-width: 0; }
  body.modal-open { overflow: hidden; }
  @media (max-width: 640px) {
    .hw { flex-wrap: wrap; gap: 10px; }
    .hw-main { flex-basis: 100%; }
    .hw-actions { width: 100%; justify-content: flex-end; border-top: 1px solid var(--line); padding-top: 8px; }
    .hw-actions .done-btn { margin-right: auto; }
    .icon-btn { width: 44px; height: 44px; }
    .status-filter { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .empty { text-align: center; padding: 54px 20px; }
  .empty .icon {
    width: 62px; height: 62px; border-radius: 18px; margin: 0 auto 16px;
    background: #ededf0; display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  .empty h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .empty p { font-size: 13px; color: var(--text-3); line-height: 1.7; }
  .loading { text-align: center; color: var(--text-3); padding: 44px 0; font-size: 14px; }

  .fab {
    display: none; position: fixed; right: 20px; bottom: calc(22px + env(safe-area-inset-bottom));
    height: 54px; padding: 0 22px; border-radius: 27px; border: none; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    box-shadow: 0 8px 22px rgba(107,79,216,.34); z-index: 5;
  }
  @media (max-width: 640px) {
    .fab { display: block; }
    #desktop-add { display: none; }
    .greet { font-size: 20px; }
  }

  /* ============ 弹窗 ============ */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(20,20,28,.4);
    align-items: center; justify-content: center; padding: 16px; z-index: 10;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--card); border-radius: 20px; padding: 22px;
    width: 100%; max-width: 430px; max-height: 88vh; overflow-y: auto;
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: .6; transform: translateY(10px) scale(.98); } }
  .modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 18px; }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
  .modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
  @media (max-width: 640px) {
    .overlay { align-items: flex-end; padding: 0; }
    .modal { border-radius: 20px 20px 0 0; max-width: 100%; padding-bottom: calc(22px + env(safe-area-inset-bottom)); animation: sheet .22s ease-out; }
    @keyframes sheet { from { transform: translateY(30px); opacity: .7; } }
  }
  #originTip { max-width: 400px; margin: 0 auto 16px; }
  /* Timetable import is a review workflow; the original screenshot stays on device. */
  .tt-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:18px 0 14px; }
  .tt-head h2 { font-size:18px; }
  .tt-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .tt-meta { color:var(--text-2); font-size:13px; margin-bottom:12px; }
  .tt-scroll { overflow-x:auto; background:white; border:1px solid var(--line-2); border-radius:8px; }
  .tt-grid { display:grid; width:100%; grid-template-columns:54px repeat(7,minmax(0,1fr)); grid-template-rows:40px repeat(12,60px); position:relative; }
  .tt-cell { min-width:0; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:6px 2px; font-size:12px; text-align:center; }
  .tt-cell small { display:block; font-size:10px; line-height:1.35; color:var(--text-2); }
  .tt-lesson { min-width:0; margin:2px; z-index:1; border:0; border-left:3px solid var(--accent); border-radius:4px; padding:5px 3px; color:var(--text); text-align:left; background:#e8f6ee; overflow:hidden; cursor:pointer; font:inherit; font-size:11px; line-height:1.3; overflow-wrap:anywhere; }
  .tt-lesson strong { display:block; font-weight:650; }
  .tt-lesson small { display:block; margin-top:4px; color:var(--text-2); font-size:10px; overflow-wrap:anywhere; }
  .tt-unplaced { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin:10px 0 14px; padding:10px 12px; border-left:3px solid var(--orange); background:var(--orange-soft); color:var(--text-2); font-size:12px; }
  .tt-unplaced strong { display:block; margin-bottom:2px; color:var(--text); font-size:13px; }
  .tt-unplaced p { margin:0; }
  .tt-unplaced details { flex:0 0 auto; max-width:46%; }
  .tt-unplaced summary { color:var(--accent); cursor:pointer; }
  .tt-unplaced ul { margin:6px 0 0 16px; max-height:180px; overflow:auto; }
  .tt-section { padding:18px 0; border-top:1px solid var(--line-2); }
  .tt-section h3 { font-size:15px; margin-bottom:12px; }
  .tt-row { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .tt-row .field { margin:0; }
  .tt-note { font-size:12px; color:var(--text-2); margin:10px 0; overflow-wrap:anywhere; }
  .tt-upload { display:block; border:1px dashed var(--accent); border-radius:8px; padding:14px; background:white; }
  .tt-upload input { width:100%; margin-top:8px; font-size:14px; }
  .tt-preview { display:block; width:100%; height:auto; max-height:620px; object-fit:contain; background:#e9e9ec; touch-action:none; }
  .tt-bounds { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:12px 0; }
  .tt-bounds input { padding:9px 5px; font-size:14px; }
  .tt-check { display:flex; align-items:flex-start; gap:8px; font-size:13px; margin:12px 0; }
  .tt-check input { width:18px; height:18px; flex-shrink:0; margin-top:1px; accent-color:var(--accent); }
  .tt-progress { display:flex; gap:10px; align-items:center; font-size:13px; margin:12px 0; }
  .tt-progress progress { width:100px; accent-color:var(--accent); }
  .tt-review { border-bottom:1px solid var(--line-2); padding:16px 0; }
  .tt-review-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .tt-review-head strong { font-size:14px; }
  .tt-review .field { margin-bottom:10px; }
  .tt-review .tt-row .field { margin-bottom:10px; }
  .tt-review:has(input[data-key="confirmed"]:checked) { border-left:3px solid var(--green); padding-left:10px; }
  .tt-footer { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; flex-wrap:wrap; }
  #tt-editor[aria-busy="true"] .tt-edit-control { pointer-events:none; opacity:.5; }
  .tt-periods { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:12px; }
  .tt-period-line { display:flex; align-items:center; gap:5px; font-size:12px; min-width:0; }
  .tt-period-line input { min-width:0; width:100%; font-size:14px; padding:6px 3px; border:1px solid var(--line-2); border-radius:4px; }
  @media (max-width:640px) {
    .tt-head { align-items:flex-start; }
    .tt-actions { gap:6px; }
    .tt-actions .btn { padding:9px; }
    .tt-periods { grid-template-columns:1fr; }
    .tt-bounds { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .tt-grid { grid-template-columns:48px repeat(7,minmax(0,1fr)); grid-template-rows:38px repeat(12,58px); }
    .tt-cell { padding:5px 1px; font-size:10px; }
    .tt-cell small { font-size:9px; }
    .tt-lesson { margin:1px; border-left-width:2px; padding:4px 2px; font-size:10.5px; }
    .tt-lesson strong { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:6; overflow:hidden; }
    .tt-lesson small { font-size:9px; }
    .tt-unplaced { display:block; }
    .tt-unplaced details { max-width:none; margin-top:8px; }
  }
</style>
</head>
<body>

<!-- ==================== 登录 / 注册 ==================== -->
<div class="wrap hidden" id="authView">
  <div id="originTip" class="msg err"></div>
  <div class="brand">
    <div class="brand-mark">作</div>
    <h1>作业记录本</h1>
    <p>手机和电脑，看到的是同一份</p>
  </div>

  <div class="auth-card">
    <div class="tabs">
      <button id="tab-pwd" class="active" onclick="switchTab('pwd')">密码登录</button>
      <button id="tab-otp" onclick="switchTab('otp')">验证码登录</button>
      <button id="tab-signup" onclick="switchTab('signup')">注册</button>
    </div>
    <div class="msg" id="authMsg"></div>

    <div id="pane-pwd">
      <div class="field"><label>邮箱</label><input id="pwd-email" type="email" autocomplete="username" placeholder="you@example.com" /></div>
      <div class="field"><label>密码</label><input id="pwd-pass" type="password" autocomplete="current-password" placeholder="请输入密码" /></div>
      <button class="btn block" id="pwd-btn" onclick="doPasswordLogin()">登录</button>
      <div class="auth-foot"><button class="link" onclick="switchTab('reset')">忘记密码？</button></div>
    </div>

    <div id="pane-otp" class="hidden">
      <div class="otp-row">
        <div class="field"><label>邮箱</label><input id="otp-email" type="email" autocomplete="email" placeholder="you@example.com" /></div>
        <button class="btn ghost sm" id="otp-send" onclick="sendLoginCode()">获取验证码</button>
      </div>
      <div class="field"><label>邮箱收到的验证码</label><input id="otp-code" inputmode="numeric" placeholder="6 位数字" /></div>
      <button class="btn block" id="otp-btn" onclick="doOtpLogin()">登录</button>

<script>
/* 加载云服务 SDK：主域在国内偶发不通，带镜像自动切换 */
(function () {
  var urls = [
    "https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js",
    "https://fastly.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js",
    "https://unpkg.com/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"
  ];
  var i = 0;
  function next() {
    if (i >= urls.length) {
      document.body.insertAdjacentHTML("afterbegin",
        '<div style="max-width:720px;margin:20px auto;padding:12px 14px;border-radius:12px;background:#fdecec;color:#e5484d;font-size:13px">依赖加载失败：请检查网络后刷新页面重试。</div>');
      return;
    }
    var s = document.createElement("script");
    s.src = urls[i++];
    s.onload = function () {
      if (!window.WorkBuddyCloud) return next();
      // SDK may finish before the parser reaches the application script.
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () { startCloud(); }, { once: true });
      } else startCloud();
    };
    s.onerror = next;
    document.head.appendChild(s);
  }
  next();
})();
</script>
<script>
/* ===== 云服务初始化：endpoint 与 publishableKey 均来自 publicConfig ===== */
const publicConfig = {
  endpoint: "https://YOUR-APP-ID.app.workbuddy.host",
  publishableKey: "wbpk_YOUR_APP_ID_YOUR_PUBLISHABLE_KEY",
};
let cloud = null;
function startCloud() {
  cloud = WorkBuddyCloud.createWorkBuddyCloud({
    endpoint: publicConfig.endpoint,
    publishableKey: publicConfig.publishableKey,
  });
  cloud.auth.onAuthStateChange(function (event) {
    if (event === "SIGNED_OUT") { showAuth(); }
  });
  init();
}

const COURSES = [
  { name: "高等数学", color: "#e8c93f" },
  { name: "大学英语", color: "#4aa8dd" },
  { name: "数据结构", color: "#9b7ee0" },
  { name: "大学物理", color: "#4cc08a" },
];

let items = [];
let view = "course";
let filter = "all";
let keyword = "";
let editingId = null;
let signupCtx = null;
let pendingOtp = null;
let resetCtx = null;
let loadSequence = 0;
let sessionEpoch = 0;
let loading = false;
let saving = false;
let loadedOnce = false;
let renderSignature = "";
let returnFocus = null;
const pendingItems = new Set();
const TT_DAYS = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
// Default 12-period times; adjust to your own school's schedule.
const TT_PERIODS = [["08:00","08:50"],["09:00","09:50"],["10:10","11:00"],["11:10","12:00"],["14:00","14:50"],["15:00","15:50"],["16:10","17:00"],["17:10","18:00"],["18:30","19:20"],["19:30","20:20"],["20:30","21:20"],["21:30","22:20"]];
let timetable = null, timetableRow = null, ttDraft = null, ttImage = null;
let ttWorker = null, ttOcrRun = 0, ttOcrBusy = false, ttSaving = false, ttLoadSequence = 0;
let ttSelectedWeek = null, ttLoadOK = false;

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function showMsg(el, text, type) { const b = $(el); b.textContent = text; b.className = "msg show " + (type === "ok" ? "ok" : "err"); }
function hideMsg(el) { $(el).className = "msg"; }
function busy(btnId, on, busyText, normalText) { const b = $(btnId); b.disabled = on; b.textContent = on ? (busyText || "处理中…") : normalText; }
function courseOf(name) { return COURSES.find(c => c.name === name) || { name: name, color: "#c9c9d1" }; }
function ownCourseNames() {
  const names = (timetable && timetable.courses || []).concat((timetable && timetable.sessions || []).map(s => s.name));
  return [...new Set(names.concat(items.filter(i => (i.kind || "course") === "course").map(i => i.course)).filter(Boolean))];
}
function refreshCourseOptions() { $("courseList").innerHTML = ownCourseNames().map(name => '<option value="' + esc(name) + '"></option>').join(""); }
function dueTs(it) {
  if (!it.due_date) return Infinity;
  const d = new Date(it.due_date + "T" + (it.due_time ? it.due_time.slice(0, 5) : "23:59") + ":00");
  return isNaN(d.getTime()) ? Infinity : d.getTime();
}
function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
function dateKey(date) { return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0"); }
function dayOffset(value) {
  const [year, month, day] = value.split("-").map(Number);
  const today = new Date();
  return Math.round((Date.UTC(year, month - 1, day) - Date.UTC(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
}

/* ================= 视图切换 ================= */
function showAuth() {
  sessionEpoch++;
  loadSequence++;
  loading = false;
  loadedOnce = false;
  renderSignature = "";
  items = [];
  cancelTimetableOcr();
  timetable = null; timetableRow = null; ttDraft = null; ttImage = null; ttLoadOK = false; ttSelectedWeek = null;
  ttLoadSequence++;
  $("tt-editor").classList.add("hidden");
  $("tt-review").innerHTML = "";
  $("tt-display").innerHTML = "";
  $("tt-term").value = "";
  $("tt-source-week").value = "";
  $("tt-periods").innerHTML = "";
  hideMsg("tt-msg"); hideMsg("tt-load-msg");
  $("tt-preview").width = 1;
  $("tt-file").value = "";
  $("f-course").value = "";
  $("f-location").value = "";
  $("f-label").value = "";
  $("f-title").value = "";
  $("f-note").value = "";
  $("f-date").value = "";
  $("f-time").value = "";
  refreshCourseOptions();
  $("userEmail").textContent = "";
  $("list").innerHTML = '<div class="loading">正在读取云端数据…</div>';
  $("authView").classList.remove("hidden");
  $("appView").classList.add("hidden");
  $("fab").classList.add("hidden");
  $("overlay").classList.remove("show");
  document.body.classList.remove("modal-open");
  checkOrigin();
}
function showApp() { $("authView").classList.add("hidden"); $("appView").classList.remove("hidden"); $("fab").classList.remove("hidden"); updateViewButtons(); }
function checkOrigin() {
  const tip = $("originTip");
  const host = publicConfig.endpoint.replace(/^https?:\/\//, "").replace(/\/$/, "");
  if (location.hostname !== host) {
    tip.textContent = "提示：登录功能只在正式发布链接下可用。这里能看界面，但请用发布后的链接登录使用。";
    tip.className = "msg show err";
  } else { tip.className = "msg"; }
}
function switchTab(tab) {
  hideMsg("authMsg");
  ["pwd", "otp", "signup", "reset"].forEach(t => {
    $("pane-" + t).classList.toggle("hidden", t !== tab);
    const tb = $("tab-" + t);
    if (tb) tb.classList.toggle("active", t === tab);
  });
}
function setView(v) {
  if (view === v || saving || $("overlay").classList.contains("show")) return;
  if (ttSaving) return;
  if (ttDraft && !closeTimetableEditor()) return;
  view = v;
  filter = "all";
  keyword = "";
  $("search").value = "";
  $("statusFilter").value = "all";
  updateViewButtons();
  render();
}
function updateViewButtons() {
  $("view-course").classList.toggle("active", view === "course");
  $("view-event").classList.toggle("active", view === "event");
  $("view-explore").classList.toggle("active", view === "explore");
  $("view-timetable").classList.toggle("active", view === "timetable");
  ["hw-stats", "hw-toolbar", "filters", "list", "desktop-add", "fab"].forEach(id => $(id).classList.toggle("hidden", view === "timetable"));
  $("tt-view").classList.toggle("hidden", view !== "timetable" || !!ttDraft);
  if (view === "timetable") $("deadlineReminder").classList.add("hidden");
  const event = view === "event", statuses = event ? EVENT_STATUS_TXT : STATUS_TXT;
  $("desktop-add").textContent = event ? "＋ 记日程" : "＋ 记一条";
  $("fab").textContent = event ? "＋ 记日程" : view === "course" ? "＋ 记作业" : "＋ 记探索";
  $("stat-todo-label").textContent = event ? "待参加" : "待完成";
  $("stat-soon-label").textContent = event ? "时间已过 / 今天" : "已逾期 / 今天";
  $("stat-done-label").textContent = event ? "已结束" : "已完成";
  $("search").placeholder = event ? "搜索活动、地点或备注" : "搜索内容、课程或备注";
  const statusValue = $("statusFilter").value;
  $("statusFilter").innerHTML = '<option value="all">全部状态</option><option value="open">' + (event ? "未结束" : "待完成") + '</option>' + Object.entries(statuses).map(([key,label]) => '<option value="'+key+'">'+label+'</option>').join("");
  $("statusFilter").value = statusValue || "all";
  $("view-course").setAttribute("aria-pressed", String(view === "course"));
  $("view-event").setAttribute("aria-pressed", String(event));
  $("view-explore").setAttribute("aria-pressed", String(view === "explore"));
  $("view-timetable").setAttribute("aria-pressed", String(view === "timetable"));
}

/* ================= 登录 / 注册 ================= */
async function authCall(request) {
  try { return await request() || {}; }
  catch (error) { return { error: { message: "连接失败，请检查网络后重试。" } }; }
}
async function doPasswordLogin() {
  const email = $("pwd-email").value.trim(), password = $("pwd-pass").value;
  if (!email || !password) return showMsg("authMsg", "请填写邮箱和密码");
  busy("pwd-btn", true, "登录中…", "登录");
  const { error } = await authCall(() => cloud.auth.signInWithPassword({ email, password }));
  busy("pwd-btn", false, "", "登录");
  if (error) return showMsg("authMsg", error.message === "连接失败，请检查网络后重试。" ? error.message : "账号或密码不对，请重试");
  await enterApp();
}
async function sendLoginCode() {
  const email = $("otp-email").value.trim();
  if (!email) return showMsg("authMsg", "请先填写邮箱");
  busy("otp-send", true, "发送中…", "获取验证码");
  const res = await authCall(() => cloud.auth.signInWithOtp({ email }));
  busy("otp-send", false, "", "获取验证码");
  if (res.error) return showMsg("authMsg", res.error.message || "验证码发送失败");
  pendingOtp = res.data;
  showMsg("authMsg", "验证码已发送，请查收邮箱", "ok");
}
async function doOtpLogin() {
  const token = $("otp-code").value.trim();
  if (!pendingOtp) return showMsg("authMsg", "请先获取验证码");
  if (!token) return showMsg("authMsg", "请输入验证码");
  busy("otp-btn", true, "登录中…", "登录");
  const done = await authCall(() => pendingOtp.verify({ token }));
  busy("otp-btn", false, "", "登录");

function setSync(text, error = false) {
  $("syncStatus").textContent = text;
  $("syncStatus").classList.toggle("error", error);
}
async function loadItems(options = {}) {
  if ($("appView").classList.contains("hidden")) return;
  if (options.quiet && (loading || saving || pendingItems.size)) return;
  const sequence = ++loadSequence;
  loading = true;
  $("refresh-btn").disabled = true;
  setSync(navigator.onLine ? "正在同步…" : "网络已断开");
  try {
    const { data, error } = await cloud.database.from("homework")
      .select("id, kind, course, title, due_date, due_time, status, note, location, created_at")
      .order("due_date", { ascending: true, nullsFirst: false })
      .order("id", { ascending: true });
    if (sequence !== loadSequence) return;
    if (error) throw error;
    items = data || [];
    await loadTimetable();
    if (sequence !== loadSequence) return;
    loadedOnce = true;
    hideMsg("dataMsg");
    showGreeting();
    const signature = JSON.stringify([items, timetable, items.map(bucketOf), dateKey(new Date())]);
    if (signature !== renderSignature) {
      renderSignature = signature;
      render();
    }
    setSync("已同步 " + new Date().toLocaleTimeString("zh-CN", { hour:"2-digit", minute:"2-digit" }));
  } catch (error) {
    if (sequence !== loadSequence) return;
    setSync(navigator.onLine ? "同步失败" : "网络已断开", true);
    showMsg("dataMsg", loadedOnce ? "同步未成功，当前显示上次读取的记录。联网后可重新刷新。" : "暂时无法读取记录，请检查网络后重新刷新。");
    if (!loadedOnce) $("list").innerHTML = '<div class="empty"><h3>暂时无法读取记录</h3><p>请稍后重试</p></div>';
  } finally {
    if (sequence === loadSequence) {
      loading = false;
      $("refresh-btn").disabled = false;
    }
  }
}
async function saveHw() {
  if (saving) return;
  const title = $("f-title").value.trim();
  if (!title) return showMsg("modalMsg", "请填写内容");
  if (view === "course" && !$("f-course").value.trim()) return showMsg("modalMsg", "请选择或填写课程名称");
  if ($("f-time").value && !$("f-date").value) return showMsg("modalMsg", "设置时间时，请同时选择日期");
  if (!navigator.onLine) return showMsg("modalMsg", "当前没有网络，内容尚未保存。请联网后再试。");
  const epoch = sessionEpoch;
  hideMsg("modalMsg");
  const payload = {
    kind: view,
    course: view === "course" ? $("f-course").value.trim() : ($("f-label").value.trim() || "未分类"),
    title: title,
    due_date: $("f-date").value || null,
    due_time: $("f-time").value ? $("f-time").value + ":00" : null,
    status: $("f-status").value,
    note: $("f-note").value.trim() || null,
  };
  if (view === "event") payload.location = $("f-location").value.trim() || null;
  saving = true;
  busy("save-btn", true, "保存中…", "保存");
  try {
    const query = cloud.database.from("homework");
    const res = editingId !== null
      ? await query.update(payload).eq("id", editingId).select()
      : await query.insert(payload).select();
    if (epoch !== sessionEpoch) return;
    if (res.error) throw res.error;
    if (!res.data || !res.data.length) throw new Error("记录未保存，可能已被删除或没有修改权限。");
    saving = false;
    closeModal();
    await loadItems();
  } catch (error) {
    if (epoch === sessionEpoch) showMsg("modalMsg", error.message || "保存失败，输入内容已保留，请重试。");
  } finally {
    saving = false;
    busy("save-btn", false, "", "保存");
  }
}
async function mutateItem(id, action) {
  const key = String(id);
  if (pendingItems.has(key)) return;
  const it = items.find(item => String(item.id) === key);
  if (!it) return;
  if (action === "delete" && !confirm("删除「" + it.title + "」？删除后无法恢复。")) return;
  if (!navigator.onLine) return showMsg("dataMsg", "当前没有网络，改动尚未保存。请联网后再试。");
  const epoch = sessionEpoch;
  pendingItems.add(key);
  render();
  try {
    const query = cloud.database.from("homework");
    const res = action === "delete"
      ? await query.delete().eq("id", id).select()
      : await query.update({ status:it.status === "done" ? "todo" : "done" }).eq("id", id).select();
    if (epoch !== sessionEpoch) return;
    if (res.error) throw res.error;
    if (!res.data || !res.data.length) throw new Error("记录可能已被删除或没有修改权限，请刷新后重试。");
    await loadItems();
  } catch (error) {
    if (epoch === sessionEpoch) showMsg("dataMsg", error.message || "改动未保存，请稍后重试。");
  } finally {
    pendingItems.delete(key);
    if (epoch === sessionEpoch) render();
  }
}

function dueText(it) {
  if (!it.due_date) return it.kind === "event" ? "日期待定" : "未设截止";
  const date = it.due_date.startsWith(String(new Date().getFullYear())) ? it.due_date.slice(5) : it.due_date;
  const t = date.replaceAll("-", "/") + (it.due_time ? " " + it.due_time.slice(0, 5) : "");
  if (it.status === "done") return t;
  const diff = dueTs(it) - Date.now();
  const days = dayOffset(it.due_date);
  if (diff < 0) return t + (it.kind === "event" ? " · 时间已过" : " · 已逾期");
  if (days === 0) return t + " · 今天";
  if (days === 1) return t + " · 明天";
  if (days <= 8) return t + " · 还有 " + days + " 天";
  return t;
}
function dueClass(it) {
  if (it.status === "done" || !it.due_date) return "ok";
  const diff = dueTs(it) - Date.now();
  if (diff < 0) return "late";
  if (diff < 86400000 * 2) return "soon";
  return "ok";
}
function renderDeadlineReminder(base) {
  const box = $("deadlineReminder");
  const now = Date.now();
  const upcoming = view === "course" || view === "event" ? base.filter(it =>
    it.status !== "done" && it.due_date && dayOffset(it.due_date) >= 0 &&
    dayOffset(it.due_date) <= 3 && dueTs(it) >= now
  ).sort((a, b) => dueTs(a) - dueTs(b)) : [];
  if (!upcoming.length) {
    box.classList.add("hidden");
    box.innerHTML = "";
    return;
  }
  box.classList.remove("hidden");
  box.innerHTML = '<div class="deadline-reminder-title">' + (view === "event" ? "三天内日程<span>" + upcoming.length + " 项安排" : "三天内截止<span>" + upcoming.length + " 项未完成作业") + "</span></div>" +
    '<div class="deadline-reminder-list">' + upcoming.map(it => {
      const remaining = dayOffset(it.due_date);
      const deadline = remaining === 0 ? "今天" : remaining === 1 ? "明天" : remaining + " 天后";
      return '<button class="deadline-reminder-item" type="button" data-reminder-id="' + esc(it.id) + '">' +
        '<span>' + esc(it.course) + '</span><strong>' + esc(it.title) + '</strong><span>' + deadline +
        (it.due_time ? " " + esc(it.due_time.slice(0, 5)) : "") + "</span></button>";
    }).join("") + "</div>";
}
function bucketOf(it) {
  if (it.status === "done") return "done";
  if (!it.due_date) return "nodate";
  const ts = dueTs(it), days = dayOffset(it.due_date);

  if (days === 0) return "today";
  if (days === 1) return "tomorrow";
  if (days < 8) return "week";
  return "later";
}
const BUCKETS = [

function parseWeeks(text) {
  const value = String(text || "").replace(/[，、]/g, ",").replace(/[–—~～]/g, "-").replace(/周/g, "").replace(/\s/g, "");
  if (!value) throw new Error("请填写每门课已核实的周次");
  const result = new Set();
  for (const part of value.split(",")) {
    const m = part.match(/^(\d{1,2})(?:-(\d{1,2}))?([单双])?$/);
    if (!m) throw new Error("周次格式不正确，请用 8、5-16 或 1-17单 等格式");
    const first = +m[1], last = +(m[2] || m[1]);
    if (first < 1 || last > 30 || first > last) throw new Error("周次需在 1–30 之间，起始周不晚于结束周");
    for (let n = first; n <= last; n++) if (!m[3] || n % 2 === (m[3] === "单" ? 1 : 0)) result.add(n);
  }
  if (!result.size) throw new Error("周次范围内没有符合单双周的周次");

}

  let previousEnd = "00:00";

      if (/…|\.\.\./.test(s.name)) throw new Error("课程名称含省略号，请补齐完整名称");

  } catch (e) { if (epoch === sessionEpoch) showMsg("tt-msg", e.message || "保存失败，校正内容仍保留在此页面"); }

}
async function createTimetableWorker(run) {

async function loadTimetableImage(file) {

function changeImageMode() {

  $("tt-locate").classList.toggle("hidden",!grid);
  if (!grid && ttImage) {
    const bounds = detailImageBounds();
    ["left","top","right","bottom"].forEach((key,i) => $("tt-"+key).value = bounds[i]);
  }

}
function timetableGridBounds() {

function drawTimetablePreview(changed = false) {
  if (!ttImage) return;

  const canvas = $("tt-preview"), scale = Math.min(1,900/ttImage.width);
  canvas.width = Math.round(ttImage.width*scale); canvas.height = Math.round(ttImage.height*scale);
  const ctx = canvas.getContext("2d"); ctx.drawImage(ttImage,0,0,canvas.width,canvas.height);

  ctx.strokeStyle = "#006f80"; ctx.lineWidth = 2;

function ocrLines(data) {
  const lines = [];
  for (const block of data.blocks || []) for (const paragraph of block.paragraphs || []) for (const line of paragraph.lines || []) lines.push(line);
  return lines;
}
function detailImageBounds() {
  const w = ttImage.width, h = ttImage.height, data = ttImage.getContext("2d").getImageData(0,0,w,h).data;

    let count = 0, total = 0;
    for (let x = Math.round(w*.15); x < w*.85; x += 5) { total++; if (white(x,y)) count++; }
    if (count/total > .45) { if (start === null) start = y; }
    else if (start !== null) { runs.push([start,y]); start = null; }
  }
  if (start !== null) runs.push([start,h*.9]);

}
function applyScreenshotMetadata(text) {
  const compact = text.replace(/\s+/g,"");
  const week = compact.match(/第(\d{1,2})周/);
  if (week && +week[1] >= 1 && +week[1] <= 30 && !$("tt-source-week").value) $("tt-source-week").value = +week[1];
  const term = compact.match(/(20\d{2})[-–—](20\d{2})学年第([12])学期/);
  if (term && !$("tt-term").value) $("tt-term").value = term[1]+"–"+term[2]+" 第"+term[3]+"学期";
}
async function locateTimetableGrid() {
  if (!ttDraft || !ttImage || ttOcrBusy || ttSaving) return;
  const run = ++ttOcrRun, epoch = sessionEpoch;
  setOcrBusy(true); hideMsg("tt-msg");
  try {
    const worker = await createTimetableWorker(run);
    await worker.setParameters({tessedit_pageseg_mode:"11"});
    ocrProgress("正在识别星期、节次和周次…",.2);
    const {data} = await worker.recognize(ttImage,{}, {blocks:true,text:true});
    if (run !== ttOcrRun || epoch !== sessionEpoch) return;
    applyScreenshotMetadata(data.text);
    const lines = ocrLines(data), days = [], rows = [];
    for (const line of lines) {
      const text = line.text.replace(/\s/g,"");
      const day = TT_DAYS.indexOf(text.replace("星期","周"));
      if (day >= 0) days.push({n:day+1,x:(line.bbox.x0+line.bbox.x1)/2,y:line.bbox.y0});
      const row = text.match(/^第(\d{1,2})[节節]$/);

      const last = dx.zero+dx.step*7.5 <= ttImage.width*1.01 ? 7 : Math.max(...days.map(p => p.n));

  } catch (e) { if (run === ttOcrRun && epoch === sessionEpoch) showMsg("tt-msg",e.message || "自动定位失败，可手动对齐网格"); }
  finally { if (run === ttOcrRun) { if (ttWorker) { await ttWorker.terminate().catch(() => {}); ttWorker = null; } setOcrBusy(false); } }
}
function gridLessonRegions(b) {

  const pixel = (x,y) => { const i = (Math.max(0,Math.min(ttImage.height-1,Math.round(y)))*ttImage.width+Math.max(0,Math.min(ttImage.width-1,Math.round(x))))*4; return [pixels[i],pixels[i+1],pixels[i+2]]; };

function cropForOcr(region) {

function parseGridCourse(text, region) {
  const lines = text.split("\n").map(t => t.trim()).filter(Boolean);
  const at = lines.findIndex(t => /^(教|新教|馆|館|[A-Z][-–]\d)/.test(t.replace(/\s/g,"")));
  const name = (at >= 0 ? lines.slice(0,at) : lines).join("").replace(/\s+/g,"");
  const location = at >= 0 ? lines.slice(at).join("").replace(/\s+/g,"") : "";

}
function parseDetailCourses(text) {
  const compact = text.replace(/\s+/g,""), dayChars = "一二三四五六日天";
  const dayMatch = compact.match(/(?:周|星期)([一二三四五六日天])/), periodMatch = compact.match(/第?(\d{1,2})[-–—~～](\d{1,2})节/), weeksMatch = compact.match(/(?:^|[^\d])(\d{1,2}(?:[-–—~～]\d{1,2})?[单双]?)周(?![一二三四五六日天])/);

async function recognizeTimetable() {
  if (!ttDraft || !ttImage || ttOcrBusy || ttSaving) return;
  const grid = $("tt-image-mode").value === "grid";
  let bounds;
  if (grid) {
    try { bounds = timetableGridBounds(); } catch (e) { return showMsg("tt-msg",e.message); }
    if (!$("tt-grid-confirm").checked) return showMsg("tt-msg","请先核对预览网格，并勾选网格对齐确认");
  }

  try {

      candidates.push(...parseDetailCourses(data.text));
    }

      const existing = !grid && candidate.day && candidate.start && candidate.end ? ttDraft.sessions.findIndex(s => s.day === candidate.day && s.start === candidate.start && s.end === candidate.end) : -1;

  } catch (e) { if (run === ttOcrRun && epoch === sessionEpoch) showMsg("tt-msg",e.message || "识别未成功，可以重试或手动添加课程"); }

}
window.addEventListener("beforeunload", e => { if (ttDraft || ttSaving) { e.preventDefault(); e.returnValue = ""; } });

  if (document.visibilityState === "visible" && !$("appView").classList.contains("hidden")) loadItems({ quiet:true });
}
document.addEventListener("visibilitychange", refreshWhenVisible);
window.addEventListener("focus", refreshWhenVisible);
window.addEventListener("online", refreshWhenVisible);
window.addEventListener("offline", () => { if (!$("appView").classList.contains("hidden")) setSync("网络已断开", true); });
setInterval(refreshWhenVisible, 45000);
document.querySelectorAll(".field").forEach(field => {
  const label = field.querySelector("label"), input = field.querySelector("input,select,textarea");
  if (label && input) label.htmlFor = input.id;
});
